name: Mirror to Codeberg

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git remote add codeberg "https://johnickmods:${CODEBERG_TOKEN}@codeberg.org/johnickmods/max-mod-johnick.git" || true
          git push codeberg --all
          git push codeberg --tags
